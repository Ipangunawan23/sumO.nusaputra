<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SUMO - Sistem Ujian Mahasiswa Online</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
<style>
:root{
  --nav:#2f4858; --bg:#f4f6f9; --slate:#546e7a; --grey:#9e9e9e; --text:#1f2933; --muted:#6b7785;
  --green-bg:#e2f8e2; --green-bd:#bfe9bf; --red-bg:#fde0e0; --red-bd:#f5b8b8; --cyan-bg:#e0f7fa; --cyan-bd:#b4ebf2;
  --blue:#1e88e5; --teal:#0f7c8a; --danger:#f44336; --ok:#2e9e4f; --maroon:#7b1646;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:'Open Sans','Segoe UI',Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.5}
button{font-family:inherit}
.topbar{position:sticky;top:0;z-index:50;background:var(--nav);color:#fff;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;gap:10px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.5px;cursor:pointer;font-size:17px}
.tb-left{display:flex;align-items:center;gap:16px}
.tb-right{display:flex;align-items:center;gap:18px;font-weight:600;font-size:14px}
.tb-right button,.tb-left button{color:#fff;background:none;border:0;font:inherit;cursor:pointer;display:flex;align-items:center;gap:6px;padding:6px 2px}
.burger{display:none!important;font-size:20px}
.flag{display:inline-block;width:28px;height:19px;border-radius:3px;background:linear-gradient(#e70011 50%,#fff 50%);box-shadow:0 0 0 1px rgba(255,255,255,.35)}
.lang{display:flex;align-items:center;gap:6px}
#hdrTimer{background:rgba(255,255,255,.15);padding:4px 10px;border-radius:14px;font-variant-numeric:tabular-nums;display:none}
.menu{position:fixed;top:56px;left:8px;background:#fff;color:var(--text);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.2);padding:6px;min-width:210px;z-index:60;display:none}
.menu.open{display:block}
.menu button{display:flex;width:100%;text-align:left;gap:10px;padding:10px 12px;background:none;border:0;border-radius:8px;font-size:14px;cursor:pointer;color:var(--text)}
.menu button:hover{background:#eef2f5}
@media(max-width:860px){.burger{display:flex!important}.hide-m{display:none!important}}

.wrap{max-width:1100px;margin:0 auto;padding:16px}
.wrap.narrow{max-width:640px}
.card{background:#fff;border:1px solid #e3e8ee;border-radius:16px;box-shadow:0 1px 3px rgba(20,40,60,.06)}
.profile{display:flex;align-items:center;gap:18px;padding:18px 24px;margin-bottom:16px}
.logo{width:60px;height:60px;border-radius:50%;background:var(--maroon);color:#f3d9a4;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex:none;border:3px solid #a33d6a;font-family:Georgia,serif}
.logo-img{width:64px;height:64px;object-fit:contain;flex:none;display:block}
.profile h1{margin:0;font-size:20px;font-weight:700;letter-spacing:.3px}
.btn{border:0;border-radius:12px;padding:11px 18px;font-weight:700;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;color:#fff;background:var(--nav)}
.btn.dark{background:var(--nav)} .btn.danger{background:var(--danger);letter-spacing:3px}
.btn.ghost{background:#eef2f5;color:var(--text)} .btn.blue{background:var(--blue)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:active{transform:translateY(1px)}
.btn.lg{font-size:16px;padding:13px 22px}
.sec-title{display:flex;align-items:center;gap:12px;margin:26px 0 14px;padding-bottom:14px;border-bottom:1px solid #dfe5eb;color:#56657a;font-weight:700;font-size:20px;letter-spacing:.8px;flex-wrap:wrap}
.count{background:#eceff3;color:var(--text);border-radius:20px;padding:4px 16px;font-size:16px}

.recap{padding:16px 20px;margin-top:14px}
.recap h3{margin:0 0 10px;font-size:15px;color:#56657a;letter-spacing:.6px}
.recap-grid{display:flex;flex-wrap:wrap;gap:8px}
.rchip{background:#f1f4f7;border-radius:10px;padding:6px 12px;font-size:13px}
.rchip b{font-size:15px}
.rtotal{margin-top:10px;font-weight:600}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(360px,100%),1fr));gap:16px}
.exam{position:relative;padding:22px 24px 22px 28px;border-left:0;overflow:hidden}
.exam::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:var(--teal)}
.exam h3{margin:0 0 10px;font-size:21px;font-weight:700;line-height:1.25}
.status{display:inline-flex;align-items:center;gap:6px;color:#fff;border-radius:20px;padding:5px 14px;font-weight:600;font-size:14px;margin-bottom:8px}
.s-idle{background:var(--blue)} .s-running{background:#fb8c00} .s-done{background:#43a047}
.lect{color:var(--muted);font-size:16px;margin-bottom:10px}
.times{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:12px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:20px;padding:4px 12px;font-weight:600;font-size:14px;border:1px solid transparent}
.pill.green{background:var(--green-bg);border-color:var(--green-bd)} .pill.red{background:var(--red-bg);border-color:var(--red-bd)} .pill.cyan{background:var(--cyan-bg);border-color:var(--cyan-bd)}
.arrow{color:#555}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{display:inline-flex;align-items:center;gap:6px;background:#eceff3;border-radius:20px;padding:6px 14px;font-weight:600;font-size:15px}
.chip.red{background:#f44336;color:#fff}
.room{background:#eff1f4;border:1px solid #d6dce3;border-radius:14px;padding:12px 18px;font-size:16px;margin-bottom:14px}
.scoreline{margin:0 0 12px;font-size:14px;color:var(--muted)} .scoreline b{color:var(--ok);font-size:16px}
.card-actions{display:flex;gap:8px;flex-wrap:wrap}

.exam-wrap{max-width:1240px;margin:0 auto;padding:20px 16px;display:grid;grid-template-columns:290px minmax(0,1fr);gap:20px;align-items:start}
.panel{padding:20px 16px;text-align:center;position:sticky;top:76px;max-height:calc(100vh - 92px);overflow:auto}
.panel h2{margin:0 0 10px;font-size:22px;font-weight:600;line-height:1.35}
.ptimes{display:flex;flex-direction:column;gap:6px;align-items:center;margin-bottom:14px}
.ptimes .row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.ptimes .pill{font-size:12px;padding:2px 10px}
.prog{text-align:left;font-size:13px;color:var(--muted);margin:10px 0 14px}
.prog .l{display:flex;justify-content:space-between}
.bar{height:8px;background:#e6eaee;border-radius:5px;margin:3px 0 4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--slate);border-radius:5px;transition:width .25s}
.glabel{margin:16px 0 10px;font-weight:600}
.nums{display:flex;flex-wrap:wrap;justify-content:center;gap:5px}
.num{min-width:40px;height:40px;padding:0 10px;border:0;border-radius:6px;background:var(--grey);color:#111;font-weight:700;font-size:15px;cursor:pointer}
.num.ans{background:var(--slate);color:#fff}
.num.cur{outline:3px solid #1e88e5;outline-offset:1px}
.num.ok{background:#43a047;color:#fff} .num.bad{background:#e53935;color:#fff} .num.skip{background:#cfd4d9;color:#333}
.timerrow{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin-top:6px}
.timer{background:#4f6470;color:#fff;border-radius:6px;padding:10px 16px;font-size:18px;font-variant-numeric:tabular-nums;font-weight:600;display:inline-flex;align-items:center}
.btn.sm{padding:10px 20px;border-radius:6px}

.main{padding:18px 22px 24px;min-width:0}
.qhead{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:flex-start}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.qpill{background:#e9edf1;color:#111;border-radius:20px;padding:3px 12px;font-weight:700;font-size:13px}
.qpill.dark{background:#5f7a88;color:#fff}
.autosave{color:var(--muted);font-size:13px;max-width:210px;text-align:right}
hr.sep{border:0;border-top:1px solid #e3e8ee;margin:14px 0 18px}
.qtext{font-size:16px;margin:0 0 18px}
.opts{display:flex;flex-direction:column;gap:14px}
.opt{display:flex;gap:26px;align-items:flex-start;border:1px solid #cfd7de;border-radius:10px;padding:14px 18px;cursor:pointer;background:#fff;transition:background .12s;text-align:left;width:100%;font-size:15.5px;color:var(--text)}
.opt:hover{background:#f7f9fa}
.opt .ltr{font-weight:700;font-size:14px;min-width:12px;padding-top:2px}
.opt .tx{flex:1}
.opt.sel{background:#c9c9c9;border-color:#8c8c8c}
.opt.static{cursor:default}
.opt.correct{background:#e4f6e7;border-color:#43a047}
.opt.wrong{background:#fdebeb;border-color:#e53935}
.tag{font-size:12px;font-weight:700;border-radius:12px;padding:2px 10px;white-space:nowrap;align-self:center}
.tag.k{background:#43a047;color:#fff} .tag.y{background:#e53935;color:#fff} .tag.yk{background:#2e7d32;color:#fff}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px;align-items:center}
.actions .sp{flex:1}
.btn.save{font-size:18px}

.essay-q h3{margin:0 0 10px;font-size:19px}
.essay-q h4{margin:16px 0 8px;font-size:16px}
.essay-q ul,.essay-q ol{margin:6px 0 6px 20px;padding:0}
.tw{overflow-x:auto;margin:8px 0 14px;-webkit-overflow-scrolling:touch}
table.dt{border-collapse:collapse;width:100%;font-size:14px;min-width:420px}
table.dt th,table.dt td{border:1px solid #cfd8dc;padding:7px 10px;text-align:left;vertical-align:top}
table.dt th{background:#eceff1;font-weight:700}
table.dt td.r,table.dt th.r{text-align:right;white-space:nowrap}
table.dt tr.tot td{font-weight:700;background:#f6f8f9}
table.dt tr.hl td{font-weight:700;background:#e8f5e9}
.recon{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:8px 0 14px}
.recon h5{margin:0 0 6px;font-size:14px}
.recon table.dt{min-width:0}
textarea#essayTa{width:100%;min-height:260px;margin-top:14px;border:1px solid #cfd7de;border-radius:10px;padding:12px 14px;font:inherit;resize:vertical}
textarea#essayTa:focus{outline:2px solid #90caf9;border-color:#90caf9}
.key{border:1px solid #bfe0c4;background:#f5fbf6;border-radius:12px;padding:6px 16px 10px;margin-top:12px}
.key h4:first-child{margin-top:10px}
.mine{white-space:pre-wrap;background:#f1f4f7;border-radius:10px;padding:10px 14px;font-size:14px;margin:6px 0 4px}
.calc{background:#f1f4f7;border-radius:10px;padding:10px 14px;font-size:14px;margin:6px 0 10px}
details.qd{margin:8px 0;border:1px solid #e3e8ee;border-radius:10px;padding:8px 14px;background:#fafbfc}
details.qd summary{cursor:pointer;font-weight:600}

.result{padding:22px}
.result h2{margin:0 0 14px}
.scorebox{display:flex;gap:26px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.ring{width:132px;height:132px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;border:10px solid var(--teal);background:#fff;flex:none}
.ring b{font-size:34px;line-height:1} .ring small{color:var(--muted)}
.stats{list-style:none;margin:0;padding:0;font-size:16px}
.stats li{margin:4px 0} .stats .ok{color:#2e7d32;font-weight:700} .stats .bad{color:#c62828;font-weight:700} .stats .skip{color:#6b7785;font-weight:700}
.rv{padding:18px 20px;margin-top:16px}
.rvhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:10px;flex-wrap:wrap}
.badge{font-size:12px;font-weight:700;border-radius:12px;padding:3px 12px;color:#fff}
.badge.ok{background:#43a047} .badge.bad{background:#e53935} .badge.skip{background:#8a949e}
.h-review{margin:26px 0 0;font-size:19px}
.intro{padding:26px}
.intro h2{margin:0 0 8px}
.intro ul{padding-left:20px;margin:10px 0 18px}

.modal-bg{position:fixed;inset:0;background:rgba(15,25,35,.55);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:16px;max-width:520px;width:100%;max-height:85vh;overflow:auto;padding:22px}
.modal h3{margin:0 0 10px}
.modal ol,.modal ul{padding-left:20px}
.modal .macts{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,30px);background:#263842;color:#fff;padding:10px 18px;border-radius:24px;opacity:0;transition:.25s;z-index:120;pointer-events:none;font-size:14px}
.toast.show{opacity:1;transform:translate(-50%,0)}
.foot{text-align:center;color:var(--muted);font-size:12px;padding:20px 10px 30px}

@media(max-width:860px){
  .exam-wrap{grid-template-columns:1fr;padding:12px}
  .panel{position:static;max-height:none}
  .panel h2{font-size:20px}
  .main{padding:16px 14px 20px}
  .autosave{text-align:left;max-width:none}
  .opt{gap:16px;padding:13px 14px}
  .recon{grid-template-columns:1fr}
  .recon .spacer{display:none}
  .exam{padding:18px 16px 18px 22px}
  .exam h3{font-size:19px}
  .profile{padding:14px 16px}
  .tb-right{gap:12px}
}
@media(max-width:420px){
  .btn.lg{width:100%;justify-content:center}
  .actions .btn{flex:1;justify-content:center}
}
.note{background:#fff8e1;border:1px solid #ffe08a;border-radius:12px;padding:10px 14px;margin:0 0 14px;font-size:14px}
.qpill.grp{background:#e0f2f1;color:#0f5a63}
.math{font-family:'Times New Roman',Georgia,serif;font-style:italic;font-size:20px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 4px}
.math .op{font-style:normal}
.math .fr{display:inline-flex;flex-direction:column;align-items:center;text-align:center}
.math .fr>span:first-child{border-bottom:1.5px solid currentColor;padding:0 6px 2px}
.math .fr>span:last-child{padding:2px 6px 0}
.math .sg{display:inline-flex;flex-direction:column;align-items:center;font-size:15px;line-height:1.1}
.math .sg .big{font-size:34px;font-style:normal;line-height:1}
.finalbox{border:1px solid #cfd8dc;border-radius:14px;padding:14px 18px;margin:10px 0;background:#fff}
.finalbox small{color:var(--muted);display:block}
.finalbox .amt{font-size:30px;font-weight:700;color:#1b9e4b}
.finalbox .par{display:inline-block;background:#e1f6e8;color:#1b7e3d;border-radius:14px;padding:2px 12px;font-weight:600;margin-top:6px;font-size:14px}

</style>
</head>

function buildCourse(c){
  var items = [];
  (c.mcq || []).forEach(function(r){ items.push({type:'mcq', q:r[0], o:r[1], a:r[2], grp:r[3] || ''}); });

/* ===================== EXAM LOGIC ===================== */
function isAnswered(it, a){
  return it.type==='mcq' ? (typeof a === 'number') : !!(a && String(a).trim());
}
function answered(ex, st){
  var c = 0;
  ex.items.forEach(function(it,i){ if(isAnswered(it, st.ans[i])) c++; });
  return c;
}
function startAttempt(id){
  var ex = EX(id), st = S(id);
  var m=[], e=[];
  ex.items.forEach(function(it,i){ (it.type==='mcq'?m:e).push(i); });
  if(st.history.length) shuffle(m);
  st.status='running'; st.order=m.concat(e); st.ans={}; st.cur=0;
  st.startedAt=Date.now(); st.endsAt=Date.now()+ex.mins*60000; st.result=null;
  save();
}
function finalize(id, auto){
  var ex = EX(id), st = S(id);
  if(st.status!=='running') return;
  var mT=0,mA=0,c=0,eT=0,eA=0;
  ex.items.forEach(function(it,i){
    var a = st.ans[i];
    if(it.type==='mcq'){ mT++; if(isAnswered(it,a)) mA++; if(a===it.a) c++; }
    else { eT++; if(isAnswered(it,a)) eA++; }
  });
  var res = {at:Date.now(), total:mT, correct:c, wrong:mA-c, blank:mT-mA, score: mT? c/mT*100 : null, essayTotal:eT, essayAnswered:eA, auto:!!auto};
  st.status='locked'; st.result=res;
  st.history.push({at:res.at,score:res.score,correct:c,total:mT});
  save();
  if(auto) toast('Waktu habis - ujian dikunci otomatis');
}
function checkExpired(){
  EXAMS.forEach(function(ex){
    var st = state[ex.id];
    if(st && st.status==='running' && st.endsAt <= Date.now()) finalize(ex.id, true);
  });
}

/* ===================== RENDER: EXAM ===================== */
function renderIntro(ex){
  var nM = nMcq(ex), nE = ex.items.length - nM;
  $('#app').innerHTML = '<div class="wrap narrow"><div class="card intro"><h2>'+esc(ex.title)+'</h2>'
   +'<div class="times" style="margin:10px 0">'+timesHtml(ex)+'</div>'
   +'<ul><li>'+infoText(ex)+'</li>'
   +'<li>Durasi: <b>'+ex.mins+' menit</b>. Timer berjalan setelah tombol Mulai ditekan.</li>'
   +'<li>Jawaban tersimpan otomatis di perangkat ini.</li>'
   +'<li>Tombol <b>Kunci</b> mengakhiri ujian.</li>'
   +'<li>Nilai akhir dihitung dari soal PG saja.'+(nE?' Essay dinilai manual oleh dosen.':'')+'</li></ul>'
   +'<div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn dark lg" data-act="start" data-id="'+ex.id+'"><i class="fas fa-play"></i> Mulai Ujian</button><button class="btn ghost lg" data-act="home">Kembali</button></div>'
   +'</div></div>';
}

function renderExam(){
  var ex = EX(route.id), st = S(route.id);
  if(st.status==='idle'){ renderIntro(ex); return; }
  $('#app').innerHTML = '<div class="exam-wrap"><aside class="card panel" id="panel"></aside><section class="card main" id="main"></section></div>';
  renderPanel(); renderMain();
}

function pillsTimes(ex){
  return '<div class="ptimes"><div class="row"><span class="pill green"><i class="far fa-calendar-times"></i> '+ex.start+' '+INVESTMENT_DATE+'</span><span class="pill cyan">UTC+7/WIB</span></div>'
   +'<div class="row"><span class="pill red"><i class="far fa-calendar-times"></i> '+endTime(ex)+' '+INVESTMENT_DATE+'</span><span class="pill cyan">UTC+7/WIB</span></div></div>';
}
function numBtn(ex, st, pos, label){
  var idx = st.order[pos], it = ex.items[idx], a = st.ans[idx], cls = 'num', ans = isAnswered(it, a);
  if(st.status==='locked'){
    if(it.type==='mcq') cls += !ans ? ' skip' : (a===it.a ? ' ok' : ' bad');
    else if(ans) cls += ' ans';
  }else{
    if(ans) cls += ' ans';
    if(pos===st.cur) cls += ' cur';
  }
  return '<button class="'+cls+'" data-act="num" data-p="'+pos+'">'+label+'</button>';
}

function renderPanel(){
  var ex = EX(route.id), st = S(route.id), p = $('#panel'); if(!p) return;
  var locked = st.status==='locked', total = ex.items.length, done = answered(ex, st), nM = nMcq(ex);
  var h = '<h2>'+esc(ex.title)+'</h2>'+pillsTimes(ex);
  if(!locked){
    h += '<div class="prog"><div class="l"><span><i class="fas fa-tasks"></i> Progres Ujian</span><span>'+done+'/'+total+' terjawab</span></div><div class="bar"><i style="width:'+(done/total*100)+'%"></i></div><div>'+(total-done)+' belum dijawab</div></div>';
  }
  var pos;
  if(nM){
    h += '<div class="glabel"><i class="fas fa-list-ul"></i> PG:</div><div class="nums">';
    for(pos=0; pos<nM; pos++) h += numBtn(ex, st, pos, pos+1);
    h += '</div>';
  }
  if(st.order.length > nM){
    h += '<div class="glabel"><i class="far fa-edit"></i> Essay:</div><div class="nums">';
    for(pos=nM; pos<st.order.length; pos++) h += numBtn(ex, st, pos, pos-nM+1);
    h += '</div>';
  }
  h += '<div class="glabel"><i class="fas fa-clock"></i> Waktu:</div><div class="timerrow">';
  if(locked){
    h += '<button class="btn dark sm" data-act="retake"><i class="fas fa-redo"></i> Ulangi</button><span class="timer">Selesai</span>';
  }else{
    h += '<button class="btn danger sm" data-act="lock"><i class="fas fa-lock"></i> Kunci</button><span class="timer" id="timer">'+fmt(st.endsAt-Date.now())+'</span>';
  }
  h += '</div>';
  p.innerHTML = h;
}

function renderMain(){
  var ex = EX(route.id), st = S(route.id), m = $('#main'); if(!m) return;
  if(st.status==='locked'){ renderResult(m, ex, st); return; }
  var nM = nMcq(ex), pos = st.cur, idx = st.order[pos], it = ex.items[idx], h='';
  if(it.type==='mcq'){
    h += '<div class="qhead"><div class="pills"><span class="qpill dark">PG '+(pos+1)+'</span>'+(it.grp?'<span class="qpill grp">'+esc(it.grp)+'</span>':'')+'<span class="qpill">PGESSAY</span></div><div class="autosave">Autosave aktif untuk membantu menjaga jawaban.</div></div><hr class="sep">';
    h += '<p class="qtext">'+esc(it.q)+'</p><div class="opts">';
    it.o.forEach(function(t,i){
      h += '<button class="opt'+(st.ans[idx]===i?' sel':'')+'" data-act="opt" data-i="'+i+'"><span class="ltr">'+LETTERS[i]+'</span><span class="tx">'+esc(t)+'</span></button>';
    });
    h += '</div>';
  }else{
    h += '<div class="qhead"><div class="pills"><span class="qpill dark">ESSAY '+(pos-nM+1)+'</span><span class="qpill">PGESSAY</span></div><div class="autosave">Autosave aktif untuk membantu menjaga jawaban.</div></div><hr class="sep">';
    h += '<div class="essay-q">'+it.q+'</div>';
    h += '<textarea id="essayTa" placeholder="Tulis jawaban Anda di sini (tabel, perhitungan, dan jurnal)...">'+esc(st.ans[idx]||'')+'</textarea>';
  }
  h += '<div class="actions"><button class="btn dark save" data-act="save"><i class="far fa-save"></i> SIMPAN</button><span class="sp"></span>';
  h += '<button class="btn ghost" data-act="prev"'+(pos===0?' disabled':'')+'><i class="fas fa-chevron-left"></i> Sebelumnya</button>';
  h += '<button class="btn ghost" data-act="next"'+(pos===st.order.length-1?' disabled':'')+'>Berikutnya <i class="fas fa-chevron-right"></i></button>';
  h += '</div>';
  m.innerHTML = h;
}

function renderResult(m, ex, st){
  var r = st.result || {}, nM = nMcq(ex);
  var h = '<div class="result" style="padding:0"><h2><i class="fas fa-flag-checkered"></i> Hasil Ujian</h2>';
  if(r.score!==null && r.score!==undefined){
    h += '<div class="scorebox"><div class="ring"><b>'+fmtScore(r.score)+'</b><small>/ 100</small></div><ul class="stats">'
      +'<li><b>Nilai Akhir (PG)</b></li>'
      +'<li class="ok"><i class="fas fa-check"></i> Benar: '+r.correct+'</li>'
      +'<li class="bad"><i class="fas fa-times"></i> Salah: '+r.wrong+'</li>'
      +'<li class="skip"><i class="fas fa-minus"></i> Tidak dijawab: '+r.blank+'</li>'
      +'<li>Total soal PG: '+r.total+'</li></ul></div>';
  }
  if(r.essayTotal){
    h += '<div class="note"><i class="far fa-edit"></i> <b>Essay:</b> '+r.essayAnswered+' dari '+r.essayTotal+' soal dijawab. Essay <b>belum dinilai</b> dan akan dievaluasi secara manual oleh dosen. Nilai akhir di atas hanya dihitung dari soal PG.</div>';
  }
  if(r.auto) h += '<p style="color:#c62828"><i class="fas fa-exclamation-triangle"></i> Ujian dikunci otomatis karena waktu habis.</p>';
  h += '<div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn dark" data-act="retake"><i class="fas fa-redo"></i> Ulangi Ujian</button><button class="btn ghost" data-act="home"><i class="fas fa-home"></i> Kembali ke Beranda</button></div></div>';
  h += '<h3 class="h-review">Pembahasan &amp; Kunci Jawaban</h3>';
  st.order.forEach(function(idx,pos){
    var it = ex.items[idx], a = st.ans[idx];
    if(it.type==='mcq'){
      var s_ = typeof a!=='number' ? 'skip' : (a===it.a ? 'ok' : 'bad');
      var lbl = {ok:'Benar',bad:'Salah',skip:'Tidak dijawab'}[s_];
      h += '<div class="card rv" id="rv'+pos+'"><div class="rvhead"><div class="pills"><span class="qpill dark">PG '+(pos+1)+'</span>'+(it.grp?'<span class="qpill grp">'+esc(it.grp)+'</span>':'')+'</div><span class="badge '+s_+'">'+lbl+'</span></div><p class="qtext">'+esc(it.q)+'</p><div class="opts">';
      it.o.forEach(function(t,i){
        var c='opt static', tag='';
        if(i===it.a){ c+=' correct'; tag = (a===i) ? '<span class="tag yk">Jawabanmu &middot; Benar</span>' : '<span class="tag k">Kunci Jawaban</span>'; }
        else if(a===i){ c+=' wrong'; tag='<span class="tag y">Jawabanmu</span>'; }
        h += '<div class="'+c+'"><span class="ltr">'+LETTERS[i]+'</span><span class="tx">'+esc(t)+'</span>'+tag+'</div>';
      });
      h += '</div></div>';
    }else{
      h += '<div class="card rv" id="rv'+pos+'"><div class="rvhead"><span class="qpill dark">ESSAY '+(pos-nM+1)+'</span><span class="badge skip">Dinilai manual oleh dosen</span></div>'
        +'<details class="qd"><summary>Lihat soal</summary><div class="essay-q">'+it.q+'</div></details>'
        +'<h4 style="margin:12px 0 4px">Jawabanmu</h4><div class="mine">'+(a&&String(a).trim()? esc(a) : '<i>Tidak dijawab</i>')+'</div>'
        +'<div class="key essay-q"><h4><i class="fas fa-key"></i> Contoh Jawaban (Kunci)</h4>'+it.key+'</div></div>';
    }
  });
  m.innerHTML = h;
}

/* ===================== RENDER (ROOT) ===================== */
function render(){
  checkExpired();
  var inExam = route.view==='exam';
  $('#btnExit').style.display = inExam ? 'flex' : 'none';
  var ht = $('#hdrTimer');
  if(inExam && S(route.id).status==='running'){ ht.style.display='inline-block'; ht.innerHTML='<i class="far fa-clock"></i> '+fmt(S(route.id).endsAt-Date.now()); }
  else ht.style.display='none';
  closeMenu();
  if(inExam) renderExam(); else renderHome();
}

function tick(){
  if(route.view!=='exam') return;
  var st = S(route.id);
  if(st.status!=='running') return;
  var left = st.endsAt - Date.now();
  if(left<=0){ finalize(route.id,true); render(); return; }
  var t = $('#timer'); if(t) t.textContent = fmt(left);
  var ht = $('#hdrTimer'); if(ht) ht.innerHTML = '<i class="far fa-clock"></i> '+fmt(left);
}
setInterval(tick, 1000);

/* ===================== MENU / DIALOGS ===================== */
function closeMenu(){ $('#menu').classList.remove('open'); }
function showRules(){
  showModal('<i class="fas fa-bullhorn"></i> Peraturan Ujian',
   '<ol><li>Kerjakan secara mandiri tanpa membuka catatan.</li>'
   +'<li>Jawaban tersimpan otomatis di browser perangkat ini.</li>'
   +'<li>Waktu tetap berjalan meskipun halaman ditutup. Ujian terkunci otomatis saat waktu habis.</li>'
   +'<li>Tombol <b>Kunci</b> mengakhiri ujian. Jawaban tidak dapat diubah setelah dikunci.</li>'
   +'<li>Nilai akhir dihitung <b>hanya dari soal pilihan ganda (PG)</b>. Soal essay dinilai manual oleh dosen.</li>'
   +'<li>Setelah dikunci, nilai PG, jawaban benar, dan contoh jawaban essay akan ditampilkan.</li>'
   +'<li><b>Ulangi Ujian</b> menghapus jawaban dan memulai percobaan baru dengan urutan soal PG diacak.</li></ol>',
   [{label:'Tutup',cls:'dark',fn:closeModal}]);
}
function showHelp(){
  showModal('<i class="fab fa-whatsapp"></i> Bantuan',
   '<ul><li>Ketuk nomor pada panel untuk berpindah soal.</li><li>Pilih jawaban dengan mengetuk opsi. Opsi yang dipilih berwarna abu-abu.</li><li>Nomor yang sudah dijawab berubah warna dan progres bertambah.</li><li>Gunakan Sebelumnya / Berikutnya untuk berpindah antar soal.</li></ul>',
   [{label:'Tutup',cls:'dark',fn:closeModal}]);
}
function confirmLock(){
  var ex = EX(route.id), st = S(route.id), un = ex.items.length - answered(ex,st);
  showModal('<i class="fas fa-lock"></i> Kunci ujian?',
   '<p>Setelah dikunci, ujian berakhir dan jawaban tidak dapat diubah.'+(un? ' <b>Masih ada '+un+' soal belum dijawab.</b>' : '')+'</p>',
   [{label:'Batal',cls:'ghost',fn:closeModal},{label:'Ya, Kunci',cls:'danger',fn:function(){closeModal();finalize(route.id,false);render();window.scrollTo(0,0);}}]);
}
function confirmRetake(id, fromHome){
  showModal('<i class="fas fa-redo"></i> Ulangi ujian?',
   '<p>Jawaban percobaan sebelumnya akan dihapus dan timer dimulai dari awal. Urutan soal PG akan diacak.</p>',
   [{label:'Batal',cls:'ghost',fn:closeModal},{label:'Ya, Ulangi',cls:'dark',fn:function(){
      closeModal(); startAttempt(id);
      if(fromHome){ go('/exam/'+id); } else { render(); }
      window.scrollTo(0,0);
   }}]);
}
function confirmReset(){
  showModal('<i class="fas fa-trash-alt"></i> Hapus semua data?',
   '<p>Semua jawaban, nilai, dan riwayat percobaan di perangkat ini akan dihapus.</p>',
   [{label:'Batal',cls:'ghost',fn:closeModal},{label:'Hapus',cls:'danger',fn:function(){
      closeModal(); state={}; save(); go(''); toast('Data dihapus');
   }}]);
}

/* ===================== EVENTS ===================== */
document.addEventListener('click', function(e){
  var t = e.target.closest('[data-act]');
  if(!t){
    if(!e.target.closest('.menu')) closeMenu();
    if(e.target.id==='modalBg') closeModal();
    return;
  }
  var act = t.dataset.act, id = t.dataset.id;
  var st = route.view==='exam' ? S(route.id) : null;
  switch(act){
    case 'menu': $('#menu').classList.toggle('open'); e.stopPropagation(); break;
    case 'home': go(''); break;
    case 'rules': closeMenu(); showRules(); break;
    case 'help': closeMenu(); showHelp(); break;
    case 'resetall': closeMenu(); confirmReset(); break;
    case 'modal': var a = modalActs[parseInt(t.dataset.k,10)]; if(a && a.fn) a.fn(); break;
    case 'open': go('/exam/'+id); break;
    case 'start': startAttempt(id); render(); window.scrollTo(0,0); break;
    case 'retakeHome': confirmRetake(id, true); break;
    case 'retake': confirmRetake(route.id, false); break;
    case 'lock': confirmLock(); break;
    case 'num':
      var p = parseInt(t.dataset.p,10);
      if(st.status==='locked'){ var el = document.getElementById('rv'+p); if(el) el.scrollIntoView({behavior:'smooth',block:'start'}); }
      else { st.cur = p; save(); renderPanel(); renderMain(); if(window.innerWidth<=860){ var mm=$('#main'); if(mm) mm.scrollIntoView({behavior:'smooth',block:'start'}); } }
      break;
    case 'opt':
      var idx = st.order[st.cur], i = parseInt(t.dataset.i,10);
      if(st.ans[idx]===i) delete st.ans[idx]; else st.ans[idx]=i;
      save(); renderPanel(); renderMain(); break;
    case 'save': save(); toast('Jawaban tersimpan'); break;
    case 'prev': if(st.cur>0){ st.cur--; save(); renderPanel(); renderMain(); window.scrollTo(0,0);} break;
    case 'next': if(st.cur<st.order.length-1){ st.cur++; save(); renderPanel(); renderMain(); window.scrollTo(0,0);} break;
  }
});
document.addEventListener('input', function(e){
  if(e.target.id==='essayTa' && route.view==='exam'){
    var st = S(route.id); if(st.status!=='running') return;
    st.ans[st.order[st.cur]] = e.target.value;
    save(); renderPanel();
  }
});
document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeModal(); });

/* ===================== INIT ===================== */
(function(){var l=document.createElement('link');l.rel='icon';l.href=LOGO_SRC;document.head.appendChild(l);})();
parseHash();
render();
})();
</script>
